server:
  port: 8000

spring:
  application:
    name: tuition-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/tuition_db}
    username: ${SPRING_DATASOURCE_USERNAME:soa}
    password: ${SPRING_DATASOURCE_PASSWORD:soa_dev_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

app:
  internal-token: ${APP_INTERNAL_TOKEN:${INTERNAL_API_TOKEN:change-this-internal-token}}
  account-service-url: ${APP_ACCOUNT_SERVICE_URL:${ACCOUNT_SERVICE_URL:http://account:8000}}
  payment-service-url: ${APP_PAYMENT_SERVICE_URL:${PAYMENT_SERVICE_URL:http://payment:8000}}
