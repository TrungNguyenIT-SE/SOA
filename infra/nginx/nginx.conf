events {}

http {
  limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=otp_limit:10m rate=60r/m;
  map $http_x_correlation_id $correlation_id { default $http_x_correlation_id; "" $request_id; }
  upstream web_identity { server web-identity:8000; }
  upstream account_api { server web-identity:8000; }
  upstream tuition_api { server tuition:8000; }
  upstream payment_api { server payment:8000; }

  server {
    listen 80;
    client_max_body_size 1m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id $correlation_id;
    add_header X-Correlation-Id $correlation_id always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location /api/v1/auth/login { limit_req zone=login_limit burst=10 nodelay; proxy_pass http://web_identity; }
    location /api/v1/auth/ { proxy_pass http://web_identity; }
    location /api/v1/users { proxy_pass http://web_identity; }
    location /api/v1/students { proxy_pass http://web_identity; }
    location /api/v1/transactions { proxy_pass http://web_identity; }
    location /api/v1/admin { proxy_pass http://web_identity; }
    location /api/v1/accounts { proxy_pass http://account_api; }
    location /api/v1/tuition-invoices { proxy_pass http://tuition_api; }
    location /api/v1/otp { limit_req zone=otp_limit burst=20 nodelay; proxy_pass http://tuition_api; }
    location ~ ^/api/v1/payments/.+/otp/ { limit_req zone=otp_limit burst=20 nodelay; proxy_pass http://payment_api; }
    location /api/v1/payments { proxy_pass http://payment_api; }
    location /swagger-ui/ { proxy_pass http://tuition_api; }
    location /swagger-ui.html { proxy_pass http://tuition_api; }
    location /v3/api-docs { proxy_pass http://tuition_api; }
    location /swagger/ { proxy_pass http://payment_api; }
    location /static/ { proxy_pass http://web_identity; }
    location / { proxy_pass http://web_identity; }
  }
}

